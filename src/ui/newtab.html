<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Tab - MTK Safe Browser</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #1f1f1f;
      --card-bg: #2d2e31;
      --card-border: #3c4043;
      --text-primary: #e8eaed;
      --text-secondary: #9aa0a6;
      --accent: #8ab4f8;
      --green: #81c995;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text-primary);
      font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .logo-container {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo {
      font-size: 54px;
      font-weight: 800;
      letter-spacing: -1.5px;
      background: linear-gradient(135deg, #8ab4f8, #81c995);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-flex;
      align-items: center;
      gap: 12px;
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      letter-spacing: 2px;
      padding: 4px 10px;
      border-radius: 12px;
      background: rgba(129, 201, 149, 0.15);
      color: var(--green);
      border: 1px solid rgba(129, 201, 149, 0.3);
      text-transform: uppercase;
      font-weight: 700;
      margin-top: 8px;
    }
    .search-box {
      width: 100%;
      max-width: 680px;
      background: #2d2e31;
      border: 1px solid #3c4043;
      border-radius: 28px;
      padding: 14px 22px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
      transition: all 0.2s ease;
    }
    .search-box:focus-within {
      background: #323639;
      border-color: var(--accent);
      box-shadow: 0 4px 20px rgba(138, 180, 248, 0.2);
    }
    .search-icon {
      color: var(--text-secondary);
      font-size: 18px;
    }
    .search-input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text-primary);
      font-size: 16px;
    }
    .search-input::placeholder {
      color: var(--text-secondary);
    }
    .shortcuts {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-top: 40px;
      width: 100%;
      max-width: 680px;
    }
    .shortcut-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 18px;
      text-align: center;
      text-decoration: none;
      color: var(--text-primary);
      transition: transform 0.2s, background 0.2s, border-color 0.2s;
      cursor: pointer;
    }
    .shortcut-card:hover {
      transform: translateY(-4px);
      background: #35373b;
      border-color: var(--accent);
    }
    .shortcut-icon {
      font-size: 28px;
      margin-bottom: 8px;
      display: block;
    }
    .shortcut-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .shortcut-desc {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 4px;
    }
    .protection-banner {
      margin-top: 48px;
      display: flex;
      gap: 24px;
      background: rgba(45, 46, 49, 0.6);
      border: 1px solid var(--card-border);
      padding: 14px 24px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
    }
    .stat-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-secondary);
    }
    .stat-item strong {
      color: var(--green);
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <div class="logo">
      <span>🛡️</span> MTK Browser
    </div>
    <br>
    <div class="badge">SafeSearch & AdBlock Protection Active</div>
  </div>

  <form class="search-box" id="newtab-form">
    <span class="search-icon">🔍</span>
    <input type="text" id="newtab-input" class="search-input" placeholder="Search Google safely or enter website address..." autofocus spellcheck="false">
  </form>

  <div class="shortcuts">
    <div class="shortcut-card" onclick="location.href='https://www.google.com/?safe=active'">
      <span class="shortcut-icon">🌐</span>
      <div class="shortcut-title">Google Safe</div>
      <div class="shortcut-desc">Filtered Search</div>
    </div>
    <div class="shortcut-card" onclick="location.href='https://www.youtube.com'">
      <span class="shortcut-icon">▶️</span>
      <div class="shortcut-title">YouTube Safe</div>
      <div class="shortcut-desc">Strict Restricted Mode</div>
    </div>
    <div class="shortcut-card" onclick="location.href='https://en.wikipedia.org'">
      <span class="shortcut-icon">📚</span>
      <div class="shortcut-title">Wikipedia</div>
      <div class="shortcut-desc">Knowledge Base</div>
    </div>
    <div class="shortcut-card" onclick="location.href='https://www.khanacademy.org'">
      <span class="shortcut-icon">🎓</span>
      <div class="shortcut-title">Khan Academy</div>
      <div class="shortcut-desc">Safe Learning</div>
    </div>
  </div>

  <div class="protection-banner">
    <div class="stat-item">
      <span>🔒</span> <strong>HTTPS</strong> Upgrades
    </div>
    <div class="stat-item">
      <span>🚫</span> <strong>Zero</strong> Adult Content
    </div>
    <div class="stat-item">
      <span>⚡</span> <strong>Brave-Fast</strong> AdBlock
    </div>
  </div>

  <script>
    document.querySelector('#newtab-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const query = document.querySelector('#newtab-input').value.trim();
      if (!query) return;
      if (query.startsWith('http://') || query.startsWith('https://')) {
        location.href = query;
      } else if (query.includes('.') && !query.includes(' ')) {
        location.href = 'https://' + query;
      } else {
        location.href = 'https://www.google.com/search?safe=active&q=' + encodeURIComponent(query);
      }
    });
  </script>
</body>
</html>

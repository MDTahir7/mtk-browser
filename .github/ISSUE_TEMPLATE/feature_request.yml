name: Feature Request
description: Suggest an idea or enhancement for MTK Browser
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement to MTK Browser!
        Please review our [Roadmap](https://github.com/MDTahir7/mtk-browser/blob/main/docs/ROADMAP.md) before submitting to see if your idea is already planned.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is. (e.g. I am always frustrated when...)
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the Solution You'd Like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe Alternatives You've Considered
      description: Any alternative solutions or features you've evaluated.
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or architectural considerations.
